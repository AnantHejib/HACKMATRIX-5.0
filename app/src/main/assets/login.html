<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in | FIN</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#144a68,#071c32 65%);color:#163149;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:28px 20px}main{width:100%;max-width:420px}.brand{color:white;font-size:38px;letter-spacing:-2px;font-weight:900;margin-bottom:24px}.brand span{color:#26dac8}.card{background:#f9fcff;border:1px solid #ffffff65;border-radius:26px;padding:28px;box-shadow:0 24px 70px #0004}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 8px}.intro{color:#607387;line-height:1.6;margin:0 0 24px}label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}input{width:100%;border:1px solid #cfdce7;border-radius:12px;background:white;font:inherit;padding:14px;color:#163149}input:focus{outline:3px solid #1386db30;border-color:#1386db}small{color:#607387;display:block;margin-top:7px;line-height:1.5}.submit{width:100%;border:0;border-radius:12px;background:#086bc1;color:white;font:inherit;font-weight:700;min-height:50px;margin-top:24px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.switch{text-align:center;font-size:14px;color:#607387;margin:22px 0 0}a{color:#086bc1;font-weight:700;text-decoration:none}a:focus-visible{outline:3px solid #1386db60}#message{padding:12px;border-radius:10px;background:#ffedf0;color:#a72535;line-height:1.5;font-size:14px;margin-top:18px}#message.success{background:#e2f7f0;color:#076c52}[hidden]{display:none!important}.foot{color:#a1bdcf;text-align:center;font-size:12px;margin-top:22px}
</style><script src="login.js" defer></script></head><body><main><div class="brand">F<span>IN</span></div><section class="card" aria-labelledby="title"><h1 id="title">Sign in</h1><p class="intro" id="intro">Welcome back. Sign in to your financial workspace.</p><form id="accessForm">
<div id="signupFields" hidden><label for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254"></div>
<label for="phone">Mobile number</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" pattern="[0-9]{10}" minlength="10" maxlength="10" required aria-describedby="phoneHint"><small id="phoneHint">Enter exactly 10 digits, without a country code.</small>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><small id="passwordHint" hidden>Use at least 8 characters.</small>
<div id="confirmFields" hidden><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128"></div>
<button class="submit" id="submitButton" type="submit">Sign in</button></form><div id="message" role="alert" hidden></div><p class="switch" id="switchCopy">Don't have an account? <a href="#signup">Sign up</a></p></section><p class="foot">FIN · Your financial workspace</p></main></body></html>
