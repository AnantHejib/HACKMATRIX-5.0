apply plugin: 'com.android.application'

android {
    namespace 'com.ctrlaltelite.fin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ctrlaltelite.fin'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
